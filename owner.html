<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F2A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Shop Owner View</title>
<!--
  Owner phone view — v1 (Sivaji Bank Pawnshop Manager 3.12)
  Link: owner.html#O1.<hdr>.<salt>.<iv>.<ciphertext>
    The passcode unlocks (PBKDF2-SHA256 → AES-GCM) the address of the shop's
    encrypted summary and its 256-bit key. The summary is fetched from the shop's
    own Worker and decrypted here. Read-only: this page never sends anything.
-->
<style>
:root{--ink:#1F2A22;--muted:#6B7C70;--line:#E3E9E3;--bg:#F2F5F1;--g:#1A7A3C;--r:#B42318;--a:#B4520F;--gold:#C9A84C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{background:linear-gradient(135deg,#0F2A1A,#1A5C34 60%,#2C1F0A);color:#F6E7B8;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .s{font-weight:800;font-size:17px}.top .u{font-size:12.5px;opacity:.85;margin-top:3px}
.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#F6E7B8;border-radius:10px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:#F8FBF7;border:1px solid var(--line);border-radius:12px;padding:11px}
.k .l{font-size:11.5px;color:var(--muted);font-weight:700}.k .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.k .n{font-size:12px;color:var(--muted);margin-top:1px}
.red{color:var(--r)}.green{color:var(--g)}
.gate{text-align:center}.gate h2{margin:6px 0;font-size:18px}.gate p{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
#pass{width:100%;max-width:280px;font:inherit;font-size:18px;padding:12px;border:2px solid #D8E2D8;border-radius:12px;text-align:center;outline:none}#pass:focus{border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#1A5C34,#12331F);color:#F6E7B8;margin-top:12px;width:100%;max-width:280px}
.err{color:var(--r);font-weight:700;font-size:13px;min-height:18px;margin-top:10px}
.bad{background:#FFF4F2;border:1px solid #F3C7C0;color:var(--r);border-radius:14px;padding:18px;margin-top:14px;font-weight:700;text-align:center}
.warn{background:#FFF7E6;color:#8A5A00;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F0F3F0;font-size:13.5px}
.row:last-child{border-bottom:0}.row .m{color:var(--muted);font-size:12px}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-size:11px;font-weight:800;padding:1px 5px;margin-right:6px}
.tL{background:#EEF3FB;color:#1A4A8C}.tP{background:#E6F6EC;color:#1A5C2C}.tR{background:#FFF7E6;color:#8A5A00}
svg{display:block;width:100%;height:auto}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="s" id="shop">Shop Owner View</div><div class="u" id="upd">Read-only · encrypted</div></div><div id="acts" style="display:none;gap:6px;flex-direction:column"><button onclick="load(true)">↻ Refresh</button><button onclick="lock()">🔒 Lock</button></div></div>
  <div id="gate" class="card gate">
    <div style="font-size:30px">🔐</div>
    <h2>Enter your passcode</h2>
    <p>This page shows your shop's figures. It opens only with the passcode you chose in the shop app.</p>
    <input id="pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
    <br><button class="btn" id="go" onclick="unlock()">Open</button>
    <div class="err" id="err"></div>
  </div>
  <div id="view"></div>
  <div class="foot">Figures sent by the shop computer. Read-only — nothing can be changed from here.</div>
</div>
<script>
'use strict';
function b64uDec(s) { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const inr = (n) => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const short = (n) => { n = +n || 0; if (n >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr'; if (n >= 1e5) return '₹' + (n / 1e5).toFixed(2) + ' L'; return inr(n); };
let L = null, SEC = null, TIMER = 0;

(function boot() {
  try {
    const f = location.hash.replace(/^#/, '');
    if (f.indexOf('O1.') !== 0) throw 0;
    const p = f.split('.'); if (p.length !== 5) throw 0;
    const hdrB = b64uDec(p[1]);
    L = { hdr: JSON.parse(new TextDecoder().decode(hdrB)), hdrB, salt: b64uDec(p[2]), iv: b64uDec(p[3]), ct: b64uDec(p[4]) };
    if (L.hdr.sn) document.getElementById('shop').textContent = L.hdr.sn;
    if (!(window.crypto && crypto.subtle)) throw 'crypto';
    setTimeout(() => document.getElementById('pass').focus(), 300);
  } catch (e) {
    document.getElementById('gate').outerHTML = '<div class="bad">' + (e === 'crypto' ? 'Please open this link in Chrome or Safari.' : 'This link is incomplete. Open the link from the shop app again.') + '</div>';
  }
})();

function lockState() { try { return JSON.parse(localStorage.getItem('ov_lock') || '{"n":0,"u":0,"lv":0}'); } catch (e) { return { n: 0, u: 0, lv: 0 }; } }
function setLock(s) { try { localStorage.setItem('ov_lock', JSON.stringify(s)); } catch (e) {} }
let busy = false;
async function unlock() {
  if (busy || !L) return;
  const err = document.getElementById('err'), inp = document.getElementById('pass');
  const st = lockState();
  if (Date.now() < st.u) { err.textContent = 'Too many wrong tries. Wait ' + Math.ceil((st.u - Date.now()) / 1000) + ' seconds.'; return; }
  const pass = inp.value; if (!pass) return;
  busy = true; document.getElementById('go').disabled = true; err.textContent = 'Opening…';
  try {
    const te = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: L.salt, iterations: +L.hdr.it || 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: L.iv, additionalData: L.hdrB }, key, L.ct);
    SEC = JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { SEC = null; }
  busy = false; document.getElementById('go').disabled = false;
  if (!SEC || !SEC.u || !SEC.id || !SEC.k) {
    st.n = (st.n || 0) + 1;
    if (st.n >= 5) { const w = [30, 120, 300, 900][Math.min(st.lv || 0, 3)]; st.u = Date.now() + w * 1000; st.n = 0; st.lv = (st.lv || 0) + 1; err.textContent = 'Too many wrong tries. Wait ' + w + ' seconds.'; }
    else err.textContent = 'Wrong passcode.';
    setLock(st); inp.value = ''; inp.focus(); return;
  }
  setLock({ n: 0, u: 0, lv: 0 });
  inp.value = '';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('acts').style.display = 'flex';
  load(false);
  clearInterval(TIMER); TIMER = setInterval(() => { if (!document.hidden) load(false); }, 60000);
}
function lock() { SEC = null; clearInterval(TIMER); document.getElementById('view').innerHTML = ''; document.getElementById('acts').style.display = 'none'; document.getElementById('gate').style.display = ''; document.getElementById('err').textContent = ''; document.getElementById('upd').textContent = 'Read-only · encrypted'; }
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(window.__idle); window.__idle = setTimeout(lock, 5 * 60000); } else clearTimeout(window.__idle); });

async function load(manual) {
  if (!SEC) return;
  const upd = document.getElementById('upd');
  if (manual) upd.textContent = 'Refreshing…';
  try {
    const r = await fetch(SEC.u.replace(/\/+$/, '') + '/p/' + encodeURIComponent(SEC.id) + '?t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' });
    if (r.status === 404) throw new Error('gone');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = b64uDec((await r.text()).trim());
    const k = await crypto.subtle.importKey('raw', b64uDec(SEC.k), 'AES-GCM', false, ['decrypt']);
    const D = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12))));
    render(D);
  } catch (e) {
    upd.textContent = e.message === 'gone' ? 'This link was turned off in the shop app.' : 'Could not refresh — check the internet. Showing the last figures.';
  }
}
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' hour' + (h > 1 ? 's' : '') + ' ago'; return new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function bars(s7) {
  const max = Math.max(1, ...s7.map(x => x[1])), W = 320, H = 110, bw = W / s7.length;
  return '<svg viewBox="0 0 ' + W + ' ' + (H + 22) + '" role="img" aria-label="Income, last 7 days">' + s7.map((x, i) => {
    const h = Math.round(x[1] / max * (H - 16)), X = i * bw + 6, w = bw - 12;
    const lbl = x[1] ? (x[1] >= 1000 ? (x[1] / 1000).toFixed(x[1] >= 10000 ? 0 : 1) + 'k' : String(x[1])) : '';
    return '<rect x="' + X + '" y="' + (H - h) + '" width="' + w + '" height="' + Math.max(h, 1) + '" rx="4" fill="' + (i === s7.length - 1 ? '#C9A84C' : '#2E8B57') + '"/>'
      + '<text x="' + (X + w / 2) + '" y="' + (H - h - 4) + '" font-size="10" text-anchor="middle" fill="#4A5A4E">' + lbl + '</text>'
      + '<text x="' + (X + w / 2) + '" y="' + (H + 14) + '" font-size="10" text-anchor="middle" fill="#6B7C70">' + esc(x[0].split('-').reverse().join('/')) + '</text>';
  }).join('') + '</svg>';
}
function render(D) {
  const T = D.today || {}, M = D.month || {}, F = D.pf || {};
  document.getElementById('shop').textContent = D.sn || (L.hdr.sn || 'Shop');
  document.getElementById('upd').textContent = 'Updated ' + ago(D.ts) + ' · read-only';
  const stale = Date.now() - D.ts > 45 * 60000;
  const mPct = M.prev ? Math.round((M.inc - M.prev) / M.prev * 100) : null;
  let h = '';
  if (stale) h += '<div class="warn">⏸ No update for ' + ago(D.ts).replace(' ago', '') + ' — the shop app may be closed.</div>';
  h += '<div class="card"><div class="h">Today</div><div class="grid">'
    + '<div class="k"><div class="l">Loans given</div><div class="v">' + short(T.aL) + '</div><div class="n">' + (T.nL || 0) + ' pledge' + (T.nL === 1 ? '' : 's') + '</div></div>'
    + '<div class="k"><div class="l">Money received</div><div class="v green">' + short(T.aP) + '</div><div class="n">' + (T.nP || 0) + ' payment' + (T.nP === 1 ? '' : 's') + ' · ' + (T.nR || 0) + ' redeemed</div></div>'
    + '<div class="k"><div class="l">Income today</div><div class="v">' + inr(T.inc) + '</div><div class="n">interest + charges</div></div>'
    + '<div class="k"><div class="l">This month</div><div class="v">' + short(M.inc) + '</div><div class="n">' + (mPct == null ? (M.nL || 0) + ' new pledges' : (mPct >= 0 ? '▲ ' : '▼ ') + Math.abs(mPct) + '% vs last month') + '</div></div>'
    + '</div></div>';
  h += '<div class="card"><div class="h">Income — last 7 days</div>' + bars(D.s7 || []) + '</div>';
  h += '<div class="card"><div class="h">Loan book</div><div class="grid">'
    + '<div class="k"><div class="l">Active pledges</div><div class="v">' + (F.n || 0).toLocaleString('en-IN') + '</div><div class="n">' + (F.gold || 0).toLocaleString('en-IN') + ' g gold</div></div>'
    + '<div class="k"><div class="l">Outstanding</div><div class="v">' + short(F.prin) + '</div><div class="n">principal</div></div>'
    + '<div class="k"><div class="l">Overdue 90+ days</div><div class="v' + (F.od ? ' red' : '') + '">' + (F.od || 0) + '</div><div class="n">' + short(F.odPrin) + '</div></div>'
    + '<div class="k"><div class="l">Due in 7 days</div><div class="v">' + (F.due7 || 0) + '</div><div class="n">pledges</div></div>'
    + '</div></div>';
  const R = D.recent || [];
  h += '<div class="card"><div class="h">Today at the counter</div>' + (R.length ? R.map(r => '<div class="row"><div><span class="tag t' + r[0] + '">' + ({ L: 'Loan', P: 'Paid', R: 'Redeem' }[r[0]] || r[0]) + '</span>' + esc(r[1]) + (r[2] ? ' · ' + esc(r[2]) : '') + (r[4] ? '<div class="m">' + esc(r[4]) + '</div>' : '') + '</div><b>' + inr(r[3]) + '</b></div>').join('') : '<div class="m" style="color:var(--muted);font-size:13px">Nothing yet today.</div>') + '</div>';
  const O = D.odTop || [];
  if (O.length) h += '<div class="card"><div class="h">Longest overdue</div>' + O.map(o => '<div class="row"><div>' + esc(o[0]) + (o[1] ? ' · ' + esc(o[1]) : '') + '<div class="m">' + o[2] + ' days</div></div><b>' + inr(o[3]) + '</b></div>').join('') + '</div>';
  document.getElementById('view').innerHTML = h;
}
</script>
</body>
</html>

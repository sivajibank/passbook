<title>Shop Owner View</title>
<!--
  Owner phone view — v2 (Sivaji Bank Pawnshop Manager 3.13)
  Link: owner.html#O1.<hdr>.<salt>.<iv>.<ciphertext>
    The passcode unlocks (PBKDF2-SHA256 → AES-GCM) the address of the shop's
    encrypted summary and its 256-bit key. The summary is fetched from the shop's
    own Worker and decrypted here. Read-only: this page never sends anything to
    the shop. Opens v1 (plain JSON) and v2 (LZ-compressed) summaries.

<style>
:root{--ink:#1F2A22;--muted:#6B7C70;--line:#E3E9E3;--bg:#F2F5F1;--g:#1A7A3C;--r:#B42318;--a:#B4520F;--gold:#C9A84C;--blue:#1A4A8C;--card:#fff;--soft:#F8FBF7;--inbg:#fff;--warnbg:#FFF7E6;--warnfg:#8A5A00;--infobg:#EEF3F8;--infofg:#3A5A7A}
html[data-theme=dark]{--ink:#E6ECE7;--muted:#9AAEA0;--line:#2A3A2F;--bg:#0D1410;--g:#5BD08A;--r:#FF8A80;--a:#FFB74D;--gold:#E0C46A;--blue:#8AB4F8;--card:#151F18;--soft:#1A2820;--inbg:#0F1813;--warnbg:#3A2E14;--warnfg:#FFD58A;--infobg:#17263A;--infofg:#AFC8E8;color-scheme:dark}
html[data-theme=dark] .tL{background:#1B2A44;color:#A9C4F5}html[data-theme=dark] .tP{background:#173523;color:#8FE0AE}html[data-theme=dark] .tR{background:#3A2E14;color:#FFD58A}
html[data-theme=dark] .p1{background:#3A2E14;color:#FFD58A}html[data-theme=dark] .p2{background:#3D1A18;color:#FF9A90}
html[data-theme=dark] .seg button.on{background:#173523;color:#8FE0AE;border-color:#2B5A3C}html[data-theme=dark] .bad{background:#3D1A18;border-color:#5C2A26}
html[data-theme=dark] svg text{fill:#9AAEA0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{background:linear-gradient(135deg,#0F2A1A,#1A5C34 60%,#2C1F0A);color:#F6E7B8;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .s{font-weight:800;font-size:17px}.top .u{font-size:12.5px;opacity:.85;margin-top:3px}
.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#F6E7B8;border-radius:10px;padding:6px 9px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:#14301F;color:#F6E7B8;border-color:#14301F}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px}
.k .l{font-size:11.5px;color:var(--muted);font-weight:700}.k .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.k .n{font-size:12px;color:var(--muted);margin-top:1px}
.red{color:var(--r)}.green{color:var(--g)}.amber{color:var(--a)}
.gate{text-align:center}.gate h2{margin:6px 0;font-size:18px}.gate p{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
#pass{width:100%;max-width:280px;font:inherit;font-size:18px;padding:12px;background:var(--inbg);color:var(--ink);border:2px solid var(--line);border-radius:12px;text-align:center;outline:none}#pass:focus{border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#1A5C34,#12331F);color:#F6E7B8;margin-top:12px;width:100%;max-width:280px}
.err{color:var(--r);font-weight:700;font-size:13px;min-height:18px;margin-top:10px}
.bad{background:#FFF4F2;border:1px solid #F3C7C0;color:var(--r);border-radius:14px;padding:18px;margin-top:14px;font-weight:700;text-align:center}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}.m{color:var(--muted);font-size:12px}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tap{cursor:pointer}.tap:active{background:#F6FAF5}
.tag{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-size:11px;font-weight:800;padding:1px 5px;margin-right:6px}
.tL{background:#EEF3FB;color:#1A4A8C}.tP{background:#E6F6EC;color:#1A5C2C}.tR{background:#FFF7E6;color:#8A5A00}
.acts{display:flex;gap:6px;flex:0 0 auto}
.acts a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-size:17px;background:var(--soft)}
.seg{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#E6F6EC;color:#1A5C2C;border-color:#BFE3CB}
#q{width:100%;font:inherit;font-size:16px;padding:11px 12px;background:var(--inbg);color:var(--ink);border:2px solid var(--line);border-radius:12px;outline:none}#q:focus{border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}.kv span{color:var(--muted)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800}
.p1{background:#FFF7E6;color:#8A5A00}.p2{background:#FDECEA;color:var(--r)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
.sheet{position:fixed;inset:0;background:rgba(10,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px;max-height:85vh;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ph{margin:10px 0 4px;text-align:center}.ph img{max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--line)}
#report{display:none;background:#fff;color:#111;padding:16px}#report h1{font-size:18px;margin:0 0 4px}#report h2{font-size:14px;margin:16px 0 6px}#report table{font-size:12px}#report td,#report th{border-bottom:1px solid #ddd;color:#111}
body.rep .wrap{display:none}body.rep #report{display:block}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.5}
@media print{.tabs,.tb,.foot,.sheet,#gate,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}html[data-theme=dark] body{background:#fff}}
</style>

<div class="wrap">

  </div>
  <div class="tabs" id="tabs" style="display:none"></div>
  <div id="view"></div>
  <div class="foot" data-i="foot"></div>
</div>
<div id="report"></div>

let busy = false;

  if (busy || !L) return;
  const err = document.getElementById('err'), inp = document.getElementById('pass');
  const st = lockState();
  if (Date.now() < st.u) { err.textContent = T('wait', { s: Math.ceil((st.u - Date.now()) / 1000) }); return; }
  const pass = inp.value; if (!pass) return;
  busy = true; document.getElementById('go').disabled = true; err.textContent = T('opening');
  try {
    const te = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: L.salt, iterations: +L.hdr.it || 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: L.iv, additionalData: L.hdrB }, key, L.ct);
    SEC = JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { SEC = null; }
  busy = false; document.getElementById('go').disabled = false;
  if (!SEC || !SEC.u || !SEC.id || !SEC.k) {
    st.n = (st.n || 0) + 1;
    if (st.n >= 5) { const w = [30, 120, 300, 900][Math.min(st.lv || 0, 3)]; st.u = Date.now() + w * 1000; st.n = 0; st.lv = (st.lv || 0) + 1; err.textContent = T('wait', { s: w }); }
    else err.textContent = T('wrong');
    setLock(st); inp.value = ''; inp.focus(); return;
  }
  setLock({ n: 0, u: 0, lv: 0 });
  inp.value = ''; err.textContent = '';
  await remember();
  opened();
}
function opened() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('acts').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';
  load(false);
  clearInterval(TIMER); TIMER = setInterval(() => { if (!document.hidden) load(false); }, 60000);
}
async function lock(forget) {
  SEC = null; DATA = null; clearInterval(TIMER);
  if (forget) await idbDel('s:' + L.tag);
  document.getElementById('view').innerHTML = ''; document.getElementById('acts').style.display = 'none'; document.getElementById('tabs').style.display = 'none';
  document.getElementById('gate').style.display = ''; document.getElementById('err').textContent = ''; document.getElementById('upd').textContent = '';
}
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => {
  if (!SEC) return;
  const m = stayMins();
  if (document.hidden) { HIDDEN_AT = Date.now(); if (m === 0) lock(true); return; }
  // phones pause timers while asleep, so the time away is measured on return
  if (HIDDEN_AT && Date.now() - HIDDEN_AT > m * 60000) { HIDDEN_AT = 0; lock(true); return; }
  HIDDEN_AT = 0; load(false);
});
window.addEventListener('pageshow', e => { if (e.persisted && SEC && HIDDEN_AT && Date.now() - HIDDEN_AT > stayMins() * 60000) lock(true); });

// ── fetch + decrypt (and keep the encrypted copy for offline use) ──────────
async function decryptBlob(text) {
  const raw = b64uDec(String(text).trim());
  const k = await crypto.subtle.importKey('raw', b64uDec(SEC.k), 'AES-GCM', false, ['decrypt']);
  let s = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12)));
  if (s.indexOf('LZ1:') === 0) s = LZString.decompressFromBase64(s.slice(4));
  return JSON.parse(s);
}
async function load(manual) {
  if (!SEC) return;
  const upd = document.getElementById('upd');
  if (manual) upd.textContent = T('refreshing');
  const ck = 'ov_c_' + SEC.id;
  try {
    const r = await fetch(SEC.u.replace(/\/+$/, '') + '/p/' + encodeURIComponent(SEC.id) + '?t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' });
    if (r.status === 404) { try { localStorage.removeItem(ck); } catch (e) {} throw new Error('gone'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    DATA = await decryptBlob(text); DATA.__off = false;
    try { localStorage.setItem(ck, text); } catch (e) {}
    draw();
  } catch (e) {
    if (e.message === 'gone') { DATA = null; document.getElementById('view').innerHTML = '<div class="bad">' + T('gone') + '</div>'; upd.textContent = ''; return; }
    try { const c = localStorage.getItem(ck); if (c && (!DATA || manual)) { DATA = await decryptBlob(c); DATA.__off = true; draw(); return; } } catch (x) {}
    if (DATA) { DATA.__off = true; draw(); return; }
    document.getElementById('view').innerHTML = '<div class="bad">' + T('noNet') + '</div>';
    upd.textContent = '';
  }
}

// ── jewellery photo (own encrypted record, fetched only when the bill is open)
const PHC = {};
async function loadPhoto(bill) {
  const box = document.getElementById('ph'); if (!box || !SEC || DATA.lvl === 'figures') return;
  try {
    const hk = await crypto.subtle.importKey('raw', b64uDec(SEC.k), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const id = b64uEnc(new Uint8Array(await crypto.subtle.sign('HMAC', hk, new TextEncoder().encode('ph:' + bill)))).slice(0, 22);
    let src = PHC[id];
    if (!src) {
      const r = await fetch(SEC.u.replace(/\/+$/, '') + '/p/' + encodeURIComponent(id), { cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) { if (r.status === 404 && document.getElementById('ph') === box) box.innerHTML = '<div class="m">' + T('photoNone') + '</div>'; return; }
      const raw = b64uDec((await r.text()).trim());
      const k = await crypto.subtle.importKey('raw', b64uDec(SEC.k), 'AES-GCM', false, ['decrypt']);
      src = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12)));
      if (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(src)) return;
      PHC[id] = src;
    }
    if (document.getElementById('ph') === box) box.innerHTML = '<img src="' + src + '" alt="">';
  } catch (e) {}
}

  document.body.classList.add('rep'); window.scrollTo(0, 0); nav();
}
function closeReport(fromBack) { document.body.classList.remove('rep'); document.getElementById('report').innerHTML = ''; if (!fromBack) try { history.back(); } catch (e) {} }

// ── fingerprint / face unlock (WebAuthn passkey + PRF; nothing leaves the phone)
function bioKeyName() { return 'ov_bio_' + (L ? L.tag : ''); }
function bioRec() { try { return JSON.parse(localStorage.getItem(bioKeyName()) || 'null'); } catch (e) { return null; } }
function bioOff() { try { localStorage.removeItem(bioKeyName()); } catch (e) {} }
async function bioKey(out) {
  const base = await crypto.subtle.importKey('raw', out, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('ov-bio-1'), info: new Uint8Array(0) }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function bioGet(rawId, salt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: rawId }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
  const r = a && a.getClientExtensionResults ? a.getClientExtensionResults() : {};
  return (r.prf && r.prf.results && r.prf.results.first) || null;
}
async function bioEnable() {
  if (!SEC) return;
  if (!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext)) { alert(T('bioNo')); return; }
  try {
    const salt = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: (DATA && DATA.sn) || 'Shop owner view' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: ((L.hdr.sn || 'Shop') + (L.hdr.lb ? ' · ' + L.hdr.lb : '')) },
      challenge: crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
    const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if (!ext.prf || ext.prf.enabled === false) { alert(T('bioNo')); return; }
    let out = ext.prf.results && ext.prf.results.first;
    if (!out) out = await bioGet(cred.rawId, salt);
    if (!out) { alert(T('bioNo')); return; }
    const key = await bioKey(out), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(SEC))));
    localStorage.setItem(bioKeyName(), JSON.stringify({ id: b64uEnc(new Uint8Array(cred.rawId)), s: b64uEnc(salt), iv: b64uEnc(iv), ct: b64uEnc(ct) }));
    alert(T('bioOn'));
  } catch (e) { if (!e || e.name !== 'NotAllowedError') alert(T('bioNo')); }
}
async function bioUnlock() {
  const s = bioRec(); if (!s) return;
  const err = document.getElementById('err');
  try {
    const out = await bioGet(b64uDec(s.id), b64uDec(s.s)); if (!out) throw 0;
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(s.iv) }, await bioKey(out), b64uDec(s.ct));
    SEC = JSON.parse(new TextDecoder().decode(pt)); err.textContent = '';
    await remember(); opened();
  } catch (e) { err.textContent = T('bioFail'); }
}

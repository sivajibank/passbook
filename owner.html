<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Shop Owner View</title>
<!--
  Owner phone view — v2 (Sivaji Bank Pawnshop Manager 3.13)
  Link: owner.html#O1.<hdr>.<salt>.<iv>.<ciphertext>
    The passcode unlocks (PBKDF2-SHA256 → AES-GCM) the address of the shop's
    encrypted summary and its 256-bit key. The summary is fetched from the shop's
    own Worker and decrypted here. Read-only: this page never sends anything to
    the shop. Opens v1 (plain JSON) and v2 (LZ-compressed) summaries.
-->
<style>
:root{--ink:#1F2A22;--muted:#6B7C70;--line:#E3E9E3;--bg:#F2F5F1;--g:#1A7A3C;--r:#B42318;--a:#B4520F;--gold:#C9A84C;--blue:#1A4A8C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{background:linear-gradient(135deg,#0F2A1A,#1A5C34 60%,#2C1F0A);color:#F6E7B8;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .s{font-weight:800;font-size:17px}.top .u{font-size:12.5px;opacity:.85;margin-top:3px}
.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#F6E7B8;border-radius:10px;padding:6px 9px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:#14301F;color:#F6E7B8;border-color:#14301F}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:#F8FBF7;border:1px solid var(--line);border-radius:12px;padding:11px}
.k .l{font-size:11.5px;color:var(--muted);font-weight:700}.k .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.k .n{font-size:12px;color:var(--muted);margin-top:1px}
.red{color:var(--r)}.green{color:var(--g)}.amber{color:var(--a)}
.gate{text-align:center}.gate h2{margin:6px 0;font-size:18px}.gate p{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
#pass{width:100%;max-width:280px;font:inherit;font-size:18px;padding:12px;border:2px solid #D8E2D8;border-radius:12px;text-align:center;outline:none}#pass:focus{border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#1A5C34,#12331F);color:#F6E7B8;margin-top:12px;width:100%;max-width:280px}
.err{color:var(--r);font-weight:700;font-size:13px;min-height:18px;margin-top:10px}
.bad{background:#FFF4F2;border:1px solid #F3C7C0;color:var(--r);border-radius:14px;padding:18px;margin-top:14px;font-weight:700;text-align:center}
.warn{background:#FFF7E6;color:#8A5A00;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0F3F0;font-size:13.5px}
.row:last-child{border-bottom:0}.m{color:var(--muted);font-size:12px}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tap{cursor:pointer}.tap:active{background:#F6FAF5}
.tag{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-size:11px;font-weight:800;padding:1px 5px;margin-right:6px}
.tL{background:#EEF3FB;color:#1A4A8C}.tP{background:#E6F6EC;color:#1A5C2C}.tR{background:#FFF7E6;color:#8A5A00}
.acts{display:flex;gap:6px;flex:0 0 auto}
.acts a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-size:17px;background:#F8FBF7}
.seg{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#E6F6EC;color:#1A5C2C;border-color:#BFE3CB}
#q{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:2px solid #D8E2D8;border-radius:12px;outline:none}#q:focus{border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid #F0F3F0;font-variant-numeric:tabular-nums}td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}.kv span{color:var(--muted)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800}
.p1{background:#FFF7E6;color:#8A5A00}.p2{background:#FDECEA;color:var(--r)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
.sheet{position:fixed;inset:0;background:rgba(10,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px;max-height:85vh;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F3F0;font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.5}
@media print{.tabs,.tb,.foot,.sheet,#gate{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

<div class="wrap">
  <div class="top"><div><div class="s" id="shop">Shop Owner View</div><div class="u" id="upd"></div></div>
    <div class="tb" id="acts" style="display:none"><button onclick="load(true)" id="b-ref">↻</button><button onclick="menu()" id="b-menu">⋯</button><button onclick="lock(true)" id="b-lock">🔒</button></div></div>
  <div id="gate" class="card gate">
    <div style="font-size:30px">🔐</div>
    <h2 data-i="gt"></h2>
    <p data-i="gp"></p>
    <input id="pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
    <br><button class="btn" id="go" onclick="unlock()" data-i="open"></button>
    <div class="err" id="err"></div>
    <div style="margin-top:12px"><button onclick="setLang(LANG==='en'?'ta':'en')" style="border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--muted)" id="langbtn"></button></div>
  </div>
  <div class="tabs" id="tabs" style="display:none"></div>
  <div id="view"></div>
  <div class="foot" data-i="foot"></div>
</div>

async function decryptBlob(text) {

}

    + '<div class="k"><div class="l">' + T('outstanding') + '</div><div class="v">' + short(F.prin) + '</div><div class="n">' + T('principal') + '</div></div>'
    + '<div class="k tap" onclick="SUB.follow=\'od\';go(\'follow\')"><div class="l">' + T('od90') + '</div><div class="v' + (F.od ? ' red' : '') + '">' + (F.od || 0) + '</div><div class="n">' + short(F.odPrin) + '</div></div>'
    + '<div class="k tap" onclick="SUB.follow=\'week\';go(\'follow\')"><div class="l">' + T('due7') + '</div><div class="v">' + (F.due7 || 0) + '</div><div class="n">&nbsp;</div></div>'
    + '</div></div>';
  if (D.coll) h += collCard(D);
  const R = D.recent || [];
  if (D.lvl !== 'figures') h += '<div class="card"><div class="h">' + T('counter') + '</div>' + (R.length ? R.map(txRow).join('') : '<div class="m">' + T('nothing') + '</div>') + '</div>';
  const DY = D.days || [];
  if (DY.length) h += '<div class="card"><div class="h">' + T('closing') + '</div>' + DY.map(x => { const f = x[1] || {}; return '<div class="row"><div>' + dmy(x[0]) + '<div class="m">' + (f.nL || 0) + ' ' + T('L') + ' · ' + inr(f.aL) + ' · ' + T('P') + ' ' + inr(f.aP) + ' · ' + (f.nR || 0) + ' ' + T('R') + (f.close != null ? ' · ' + inr(f.close) : '') + '</div></div><b>' + inr(f.inc) + '</b></div>'; }).join('') + '</div>';
  const O = D.odTop || [];
  if (O.length) h += '<div class="card"><div class="h">' + T('longest') + '</div>' + O.map(o => '<div class="row tap" onclick="openBill(\'' + encodeURIComponent(o[0]) + '\')"><div>' + esc(o[0]) + (o[1] ? ' · ' + esc(o[1]) : '') + '<div class="m">' + T('days', { n: o[2] }) + '</div></div><b>' + inr(o[3]) + '</b></div>').join('') + '</div>';
  return h;
}

// ── Search · pledge detail · customer view ─────────────────────────────────
// pl row: 0 bill,1 name,2 mobile,3 date,4 amount,5 outstanding,6 interest due,7 to redeem,8 weight,9 purity,10 item,11 days,12 next due,13 customer id,14 last payment
function plRow(p) { return '<div class="row tap" onclick="openBill(\'' + encodeURIComponent(p[0]) + '\')"><div><b style="font-weight:800">' + esc(p[0]) + '</b>' + (p[1] ? ' · ' + esc(p[1]) : '') + '<div class="m">' + dmy(p[3]) + ' · ' + p[8] + ' g · ' + T('days', { n: p[11] }) + '</div></div><b>' + inr(p[7]) + '</b></div>'; }
function vSearch(D) {
  if (DETAIL) return DETAIL.cust ? vCust(D, DETAIL) : vBill(D, DETAIL.bill);
  let h = '<div class="card"><input id="q" placeholder="' + esc(T(D.lvl === 'nonames' ? 'searchPhB' : 'searchPh')) + '" oninput="Q=this.value;results()" autocomplete="off" inputmode="search"><div id="res" style="margin-top:8px">' + resultsHtml(D) + '</div></div>';
  return h;
}
function results() { const r = document.getElementById('res'); if (r) r.innerHTML = resultsHtml(DATA); }
function resultsHtml(D) {
  const q = Q.trim().toLowerCase(); if (!q) return '<div class="m">' + T('typeToSearch') + '</div>';
  const P = D.pl || [], qd = q.replace(/\D/g, '').replace(/^0+/, '');
  let hit;
  if (/^\d+$/.test(q.replace(/[\s\-\/]/g, '')) && qd) {
    const exact = P.filter(p => String(p[0]).replace(/\D/g, '').replace(/^0+/, '') === qd);
    hit = exact.length ? exact : P.filter(p => String(p[0]).replace(/\D/g, '').replace(/^0+/, '').indexOf(qd) === 0);
  } else hit = P.filter(p => String(p[1]).toLowerCase().indexOf(q) >= 0 || String(p[0]).toLowerCase() === q);
  if (!hit.length) return '<div class="m">' + T('noMatch') + '</div>';
  return hit.slice(0, 40).map(plRow).join('') + (hit.length > 40 ? '<div class="m" style="margin-top:6px">' + T('more', { n: hit.length - 40 }) + '</div>' : '');
}
function openBill(b) { b = decodeURIComponent(b); TAB = 'search'; DETAIL = { bill: b }; draw(); window.scrollTo(0, 0); }
function openCustB(b) { const p = (DATA.pl || []).find(x => String(x[0]) === decodeURIComponent(b)); if (p) openCust(p[13], p[1], p[2]); }
function openCust(cid, name, mob) { DETAIL = { cust: true, cid, name, mob }; draw(); window.scrollTo(0, 0); }
function remindText(p) { return T('remind', { n: p[1] || '', s: DATA.sn || '', b: p[0], a: inr(p[6] > 0 ? p[6] : p[7]) }); }
function vBill(D, b) {
  const p = (D.pl || []).find(x => String(x[0]) === String(b));
  let h = '<div style="margin-top:12px"><button class="seg-b" onclick="DETAIL=null;draw()" style="border:0;background:none;font:inherit;font-weight:800;color:var(--blue);padding:0">' + T('back') + '</button></div>';
  if (!p) return h + '<div class="card"><div class="m">' + T('noMatch') + '</div></div>';
  h += '<div class="card"><div class="h"><span>' + T('bill') + ' ' + esc(p[0]) + '</span>' + callBtns(p[2], remindText(p)) + '</div>'
    + (p[1] ? '<div style="font-size:18px;font-weight:800;margin-bottom:8px">' + esc(p[1]) + '</div>' : '')
    + '<div class="kv"><span>' + T('date') + '</span><b>' + dmy(p[3]) + '</b><span>' + T('loan') + '</span><b>' + inr(p[4]) + '</b>'
    + '<span>' + T('outPrin') + '</span><b>' + inr(p[5]) + '</b><span>' + T('intDue') + '</span><b class="amber">' + inr(p[6]) + '</b>'
    + '<span>' + T('redeemToday') + '</span><b style="font-size:17px">' + inr(p[7]) + '</b>'
    + '<span>' + T('weight') + '</span><b>' + p[8] + ' g</b><span>' + T('purity') + '</span><b>' + esc(p[9] || '—') + '</b>'
    + '<span>' + T('item') + '</span><b style="font-weight:600">' + esc(p[10] || '—') + '</b>'
    + '<span>' + T('daysSince') + '</span><b>' + p[11] + '</b><span>' + T('nextDue') + '</span><b>' + dmy(p[12]) + '</b><span>' + T('lastPay') + '</span><b>' + dmy(p[14]) + '</b></div>'
    + ((p[13] || p[1]) ? '<button class="btn" style="max-width:none;margin-top:14px;font-size:14px" onclick="openCustB(\'' + encodeURIComponent(p[0]) + '\')">👤 ' + T('custView') + '</button>' : '')
    + '</div>';
  return h;
}
function vCust(D, c) {
  const P = (D.pl || []).filter(p => c.cid ? p[13] === c.cid : (p[1] === c.name && p[2] === c.mob));
  const out = P.reduce((s, p) => s + p[5], 0), tot = P.reduce((s, p) => s + p[7], 0);
  const lp = P.map(p => p[14]).filter(Boolean).sort().pop();
  let h = '<div style="margin-top:12px"><button onclick="DETAIL=null;draw()" style="border:0;background:none;font:inherit;font-weight:800;color:var(--blue);padding:0">' + T('back') + '</button></div>';
  h += '<div class="card"><div class="h"><span>👤 ' + esc(c.name || '') + '</span>' + callBtns(c.mob, P[0] ? remindText(P[0]) : '') + '</div>'
    + '<div class="m" style="margin-bottom:8px">' + T('custTotals', { n: P.length, o: inr(out), t: inr(tot) }) + (lp ? ' · ' + T('lastPay') + ' ' + dmy(lp) : '') + '</div>'
    + P.map(plRow).join('') + '</div>';
  return h;
}

// ── Follow-up ──────────────────────────────────────────────────────────────
function vFollow(D) {
  const t = D.d, P = D.pl || [];
  const in7 = (() => { const d = new Date(t + 'T00:00:00'); d.setDate(d.getDate() + 7); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); })();
  const L1 = P.filter(p => p[12] === t), L2 = P.filter(p => p[12] > t && p[12] <= in7).sort((a, b) => a[12] < b[12] ? -1 : 1), L3 = P.filter(p => p[11] > 90).sort((a, b) => b[11] - a[11]);
  const s = SUB.follow, list = s === 'today' ? L1 : s === 'week' ? L2 : L3;
  let h = '<div class="card"><div class="seg">'
    + '<button class="' + (s === 'today' ? 'on' : '') + '" onclick="SUB.follow=\'today\';draw()">' + T('dueToday') + ' (' + L1.length + ')</button>'
    + '<button class="' + (s === 'week' ? 'on' : '') + '" onclick="SUB.follow=\'week\';draw()">' + T('dueWeek') + ' (' + L2.length + ')</button>'
    + '<button class="' + (s === 'od' ? 'on' : '') + '" onclick="SUB.follow=\'od\';draw()">' + T('overdue') + ' (' + L3.length + ')</button></div>';
  h += list.length ? list.slice(0, 150).map(p => '<div class="row"><div class="tap" style="flex:1" onclick="openBill(\'' + encodeURIComponent(p[0]) + '\')"><b style="font-weight:800">' + esc(p[0]) + '</b>' + (p[1] ? ' · ' + esc(p[1]) : '') + '<div class="m">' + (s === 'od' ? T('days', { n: p[11] }) : T('nextDue') + ' ' + dmy(p[12])) + ' · ' + T('intDue') + ' ' + inr(p[6]) + '</div></div><b style="margin-right:4px">' + inr(p[7]) + '</b>' + callBtns(p[2], remindText(p)) + '</div>').join('') : '<div class="m">' + T('none') + '</div>';
  return h + '</div>';
}

// ── Gold ───────────────────────────────────────────────────────────────────
function vGold(D) {
  const G = D.gold, R = D.risk;
  if (!G) return '<div class="card"><div class="m">' + T('none') + '</div></div>';
  let h = '<div class="card"><div class="h">' + T('goldStock') + '</div>';
  h += G.rate ? '<div class="m" style="margin-bottom:8px">' + T('rateUsed', { r: inr(G.rate), src: T(G.src === 'shop' ? 'srcShop' : 'srcLive') }) + (G.at ? ' · ' + ago(G.at) : '') + '</div>' : '<div class="warn" style="margin:0 0 8px">' + T('noRate') + '</div>';
  h += '<table><thead><tr><th>' + T('pur') + '</th><th class="r">' + T('wt') + '</th><th class="r">#</th><th class="r">' + T('value') + '</th></tr></thead><tbody>'
    + (G.byP || []).map(x => '<tr><td>' + esc(x[0]) + '</td><td class="r">' + x[1].toLocaleString('en-IN') + ' g</td><td class="r">' + x[3] + '</td><td class="r">' + (G.rate ? short(x[2]) : '—') + '</td></tr>').join('')
    + '<tr><td><b>' + T('total') + '</b></td><td class="r"><b>' + (G.wt || 0).toLocaleString('en-IN') + ' g</b></td><td></td><td class="r"><b>' + (G.rate ? short(G.val) : '—') + '</b></td></tr></tbody></table></div>';
  if (R && G.rate) {
    h += '<div class="card"><div class="h"><span>⚠️ ' + T('risky') + ' (' + (R.n || 0) + ')</span></div><div class="m" style="margin-bottom:6px">' + T('riskyHint', { p: R.th }) + '</div>';
    h += (R.list || []).length ? R.list.map(r => '<div class="row"><div class="tap" style="flex:1" onclick="openBill(\'' + encodeURIComponent(r[0]) + '\')"><b style="font-weight:800">' + esc(r[0]) + '</b>' + (r[1] ? ' · ' + esc(r[1]) : '') + '<div class="m">' + T('owed') + ' ' + inr(r[3]) + ' · ' + T('gv') + ' ' + inr(r[4]) + '</div></div><span class="pct ' + (r[5] >= 100 ? 'p2' : 'p1') + '">' + r[5] + '%</span>' + callBtns(r[2], '') + '</div>').join('') : (D.lvl === 'figures' ? '' : '<div class="m">' + T('none') + '</div>');
    h += '</div>';
  }
  return h;
}

// ── Reports ────────────────────────────────────────────────────────────────
function collCard(D) {
  const C = D.coll; if (!C) return '';
  return '<div class="card"><div class="h"><span>' + T('coll') + '</span><span style="text-transform:none;font-weight:600">' + T('approx') + '</span></div><div class="grid">'
    + '<div class="k"><div class="l">' + T('collWk') + '</div><div class="v">' + short(C.wk.exp) + '</div><div class="n">' + T('pledgesN', { n: C.wk.n }) + '</div></div>'
    + '<div class="k"><div class="l">' + T('collMo') + '</div><div class="v">' + short(C.mo.exp) + '</div><div class="n">' + T('pledgesN', { n: C.mo.n }) + '</div></div>'
    + '<div class="k"><div class="l">' + T('collGot') + '</div><div class="v green">' + short(C.mo.got) + '</div></div>'
    + '<div class="k"><div class="l">' + T('accrued') + '</div><div class="v amber">' + short(C.accrued) + '</div></div></div></div>';
}
function mBars(rows, keys, colors) {
  const Wd = 340, H = 120, n = rows.length, bw = Wd / n, max = Math.max(1, ...rows.map(r => Math.max(...keys.map(k => r[k]))));
  return '<svg viewBox="0 0 ' + Wd + ' ' + (H + 20) + '" role="img">' + rows.map((r, i) => keys.map((k, j) => {
    const w = (bw - 6) / keys.length, X = i * bw + 3 + j * w, h = Math.round(r[k] / max * (H - 6));
    return '<rect x="' + X + '" y="' + (H - h) + '" width="' + Math.max(w - 1, 1) + '" height="' + Math.max(h, 1) + '" rx="2" fill="' + colors[j] + '"><title>' + r[0] + ': ' + inr(r[k]) + '</title></rect>';
  }).join('') + '<text x="' + (i * bw + bw / 2) + '" y="' + (H + 14) + '" font-size="9" text-anchor="middle" fill="#6B7C70">' + ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'][+r[0].slice(5) - 1] + '</text>').join('') + '</svg>';
}
function vReports(D) {
  let h = collCard(D);
  const M = D.m12 || [];
  if (M.length) {
    h += '<div class="card"><div class="h">' + T('trend') + ' · ' + T('incomeM') + '</div>' + mBars(M, [1], ['#2E8B57']) + '<div class="legend"><span>' + short(M.reduce((s, r) => s + r[1], 0)) + ' · 12 m</span></div></div>';
    h += '<div class="card"><div class="h">' + T('trend') + ' · ' + T('loansM') + ' / ' + T('redeemM') + '</div>' + mBars(M, [2, 4], ['#1A4A8C', '#C9A84C']) + '<div class="legend"><span><i style="background:#1A4A8C"></i>' + T('loansM') + '</span><span><i style="background:#C9A84C"></i>' + T('redeemM') + '</span></div></div>';
    h += '<div class="card"><table><thead><tr><th></th><th class="r">' + T('incomeM') + '</th><th class="r">' + T('loansM') + '</th><th class="r">' + T('redeemM') + '</th></tr></thead><tbody>'
      + M.slice().reverse().map(r => '<tr><td>' + r[0].slice(5) + '/' + r[0].slice(2, 4) + '</td><td class="r">' + short(r[1]) + '</td><td class="r">' + short(r[2]) + ' <span class="m">(' + r[3] + ')</span></td><td class="r">' + short(r[4]) + ' <span class="m">(' + r[5] + ')</span></td></tr>').join('') + '</tbody></table></div>';
  }
  return h || '<div class="card"><div class="m">' + T('none') + '</div></div>';
}

// ── Staff ──────────────────────────────────────────────────────────────────
function vStaff(D) {
  let h = '';
  if (D.big) h += '<div class="card"><div class="h"><span>⚡ ' + T('big') + '</span><span>' + T('bigFrom', { a: short(D.big.th) }) + '</span></div>' + ((D.big.list || []).length ? D.big.list.map(txRow).join('') : '<div class="m">' + T('none') + '</div>') + '</div>';
  h += '<div class="card"><div class="h">' + T('activity') + '</div>' + ((D.act || []).length ? D.act.map(a => '<div class="row"><div>' + esc(a[2]) + (a[3] ? ' · <b style="font-weight:800">' + esc(a[3]) + '</b>' : '') + '<div class="m">' + esc(a[0]) + (a[1] ? ' · ' + esc(a[1]) : '') + '</div></div></div>').join('') : '<div class="m">' + T('none') + '</div>') + '</div>';
  const Pf = D.perf || [];
  h += '<div class="card"><div class="h">' + T('perf') + '</div>' + (Pf.length ? '<table><thead><tr><th>' + T('staff') + '</th><th class="r">' + T('loansC') + '</th><th class="r">' + T('collC') + '</th></tr></thead><tbody>' + Pf.map(p => '<tr><td>' + esc(p[0]) + '</td><td class="r">' + short(p[2]) + ' <span class="m">(' + p[1] + ')</span></td><td class="r">' + short(p[4]) + ' <span class="m">(' + p[3] + ')</span></td></tr>').join('') + '</tbody></table>' : '<div class="m">' + T('none') + '</div>')
    + (Pf.some(p => p[0] === 'Not recorded') ? '<div class="m" style="margin-top:6px">' + T('nostaff') + '</div>' : '') + '</div>';
  return h;
}

// ── menu: language, stay unlocked, share, PDF ──────────────────────────────
function menu() {
  const m = stayMins();
  const o = (v, k) => '<label class="opt"><input type="radio" name="stay" ' + (m === v ? 'checked' : '') + ' onchange="setStay(' + v + ')"> ' + T(k) + '</label>';
  const s = document.createElement('div'); s.className = 'sheet'; s.id = 'sheet';
  s.innerHTML = '<div><div style="font-weight:800;font-size:16px;margin-bottom:6px">' + T('menuT') + '</div>'
    + '<div class="opt tap" onclick="setLang(LANG===\'en\'?\'ta\':\'en\');closeMenu()">🌐 ' + T('lang') + '</div>'
    + '<div class="opt tap" onclick="shareToday()">📤 ' + T('share') + '</div>'
    + '<div class="opt tap" onclick="closeMenu();setTimeout(()=>window.print(),200)">🖨 ' + T('pdf') + '</div>'
    + '<div style="font-weight:800;margin:12px 0 2px">🔓 ' + T('stay') + '</div>' + o(0, 's0') + o(5, 's5') + o(60, 's60') + o(240, 's240')
    + '<button class="btn" style="max-width:none" onclick="closeMenu()">' + T('close') + '</button></div>';
  s.addEventListener('click', e => { if (e.target === s) closeMenu(); });
  document.body.appendChild(s);
}
function closeMenu() { const s = document.getElementById('sheet'); if (s) s.remove(); }
function setStay(v) { try { localStorage.setItem('ov_stay', String(v)); } catch (e) {} if (SEC) remember(); }
function summaryText() {
  const D = DATA, Td = D.today || {}, F = D.pf || {};
  const L2 = [T('summaryTitle', { s: D.sn || '', d: dmy(D.d) }), '',
    T('loansGiven') + ': ' + (Td.nL || 0) + ' · ' + inr(Td.aL),
    T('received') + ': ' + inr(Td.aP) + ' (' + T('paymentsN', { n: Td.nP || 0, r: Td.nR || 0 }) + ')',
    T('incomeToday') + ': ' + inr(Td.inc),
    T('thisMonth') + ': ' + inr((D.month || {}).inc), '',
    T('active') + ': ' + (F.n || 0) + ' · ' + T('outstanding') + ' ' + short(F.prin),
    T('od90') + ': ' + (F.od || 0) + ' (' + short(F.odPrin) + ')',
    T('due7') + ': ' + (F.due7 || 0)];
  return L2.join('\n');
}
async function shareToday() {
  const text = summaryText();
  closeMenu();
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}
</script>

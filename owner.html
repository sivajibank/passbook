<title>Shop Owner View</title>
<!--
  Owner phone view — v2 (Sivaji Bank Pawnshop Manager 3.13)
  Link: owner.html#O1.<hdr>.<salt>.<iv>.<ciphertext>
    The passcode unlocks (PBKDF2-SHA256 → AES-GCM) the address of the shop's
    encrypted summary and its 256-bit key. The summary is fetched from the shop's
    own Worker and decrypted here. Read-only: this page never sends anything to
    the shop. Opens v1 (plain JSON) and v2 (LZ-compressed) summaries.
-->
<style>
/* ── Kanjeevaram: peacock silk, kumkum, turmeric, mango leaf, zari gold ── */
:root{
  --peacock:#0F4C5C;--peacock-d:#0A3340;--kumkum:#9E1B42;--turmeric:#E19A12;--leaf:#2E8B57;--zari:#E7BE5A;--lotus:#B83C78;--indigo:#3B4C9B;
  --ink:#13242A;--muted:#5E7378;--line:#DCE6E6;--bg:#EDF3F2;--card:#FFFFFF;--soft:#F4F8F8;--inbg:#FFFFFF;
  --g:#1E7A49;--r:#B3203F;--a:#B86E00;--gold:#C99A2E;--blue:#1F5F8B;
  --warnbg:#FFF4DA;--warnfg:#7A5000;--infobg:#E3EFF3;--infofg:#1F5466;
  --t-peacock:#E2F0F2;--t-kumkum:#FBE7EE;--t-turmeric:#FFF1D6;--t-leaf:#E3F4EA;--t-lotus:#FBE6F1;--t-indigo:#E8EBFA;
  --nav-h:66px;--ease:cubic-bezier(.2,.8,.2,1)
}
html[data-theme=dark]{
  --ink:#E5EFEF;--muted:#93ABAF;--line:#21393F;--bg:#071418;--card:#0F2228;--soft:#132B32;--inbg:#0B1C21;
  --g:#5ED394;--r:#FF8FA6;--a:#FFC061;--gold:#E7BE5A;--blue:#7CC0E8;
  --warnbg:#33270C;--warnfg:#FFD98A;--infobg:#0F2D38;--infofg:#A9D6E6;
  --t-peacock:#0F3039;--t-kumkum:#3A1424;--t-turmeric:#33260C;--t-leaf:#0F3021;--t-lotus:#36152A;--t-indigo:#1A2147;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Madurai",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--zari);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom))}

/* header: peacock silk with a woven zari border */
.top{position:relative;margin:0 -14px;padding:calc(14px + env(safe-area-inset-top)) 18px 0;color:#FBEFD0;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0,#1C6E7E 0,transparent 55%),radial-gradient(90% 80% at 0 100%,#3A1630 0,transparent 60%),linear-gradient(160deg,#0A3340 0,#0F4C5C 55%,#123E4A 100%);
  border-radius:0 0 26px 26px;box-shadow:0 14px 30px -18px rgba(10,51,64,.7)}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:radial-gradient(circle at 1px 1px,#FBEFD0 1px,transparent 1.5px);background-size:16px 16px;
  -webkit-mask-image:linear-gradient(180deg,#000 0,transparent 75%);mask-image:linear-gradient(180deg,#000 0,transparent 75%)}
.top-row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#F4D27C,#C9952A);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -6px rgba(0,0,0,.5)}
.mark svg{width:24px;height:24px}
.top .s{font-weight:700;font-size:18px;line-height:1.15;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .u{font-size:12.5px;color:#BFE0DF;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;gap:7px;flex:0 0 auto}
.tb button{width:38px;height:38px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(251,239,208,.22);color:#FBEFD0;border-radius:12px;cursor:pointer;padding:0;transition:background .2s}
.tb button:active{background:rgba(255,255,255,.22)}
.tb svg{width:19px;height:19px}
.hero{position:relative;padding:16px 2px 18px}
.hero:empty{padding:8px 0}
.hero .hl{font-size:13.5px;color:#BFE0DF}
.hero .hv{font-size:44px;line-height:1.05;font-weight:700;letter-spacing:-.5px;color:#FFF6DD;font-variant-numeric:tabular-nums;margin-top:2px}
.hero .hs{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:#DCEFEE;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700}
.chip.up{background:rgba(94,211,148,.18);color:#9BF0C0}.chip.down{background:rgba(255,143,166,.18);color:#FFC2CF}
.hin{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.hleft{min-width:0}
.hero .spark{flex:0 0 36%;max-width:180px;margin-bottom:6px}
.hero h1{margin:0;font-size:26px;font-weight:700;color:#FFF6DD}
.hero .sub{font-size:13px;color:#BFE0DF;margin-top:2px}
.zari{position:relative;height:13px;margin:0 -18px;
  background:linear-gradient(#F0CC6E,#F0CC6E) top/100% 2px no-repeat,linear-gradient(#F0CC6E,#F0CC6E) bottom/100% 2px no-repeat,
  conic-gradient(from -45deg at 50% 100%,#E7BE5A 90deg,transparent 0) 0 2px/14px 9px repeat-x,#7E1638}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px 13px;color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:default;
  box-shadow:0 12px 22px -16px var(--sh,rgba(0,0,0,.5));transform:translateZ(0);transition:transform .18s var(--ease)}
.tile.tap{cursor:pointer}.tile.tap:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:radial-gradient(circle at 2px 2px,#fff 1.2px,transparent 1.6px);background-size:14px 14px;
  -webkit-mask-image:linear-gradient(200deg,#000,transparent 65%);mask-image:linear-gradient(200deg,#000,transparent 65%)}
.tile::after{content:"";position:absolute;top:-30%;bottom:-30%;width:42%;left:-60%;transform:skewX(-18deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
.tile .ti{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
.tile .ic svg{width:19px;height:19px}
.tile .tv{font-size:26px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px;letter-spacing:-.2px}
.tile .tl{font-size:13px;font-weight:600;opacity:.95}
.tile .tn{font-size:12px;opacity:.85;margin-top:1px}
.tile .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:9px;background:#fff;width:var(--w,0);transition:width 1s var(--ease)}
.c-turmeric{background:linear-gradient(150deg,#F2B33A,#D27A0A);--sh:#D27A0A}
.c-leaf{background:linear-gradient(150deg,#3DA86E,#1E6E44);--sh:#1E6E44}
.c-peacock{background:linear-gradient(150deg,#1B7487,#0C3F4D);--sh:#0C3F4D}
.c-kumkum{background:linear-gradient(150deg,#C42A58,#7E1638);--sh:#7E1638}
.c-indigo{background:linear-gradient(150deg,#5464C2,#2C3A86);--sh:#2C3A86}
.c-lotus{background:linear-gradient(150deg,#D0559A,#922C62);--sh:#922C62}
.c-zari{background:linear-gradient(150deg,#E9C25F,#B07F1C);--sh:#B07F1C;color:#2B1B00}
.c-zari .ic{background:rgba(255,255,255,.35)}
@media (prefers-reduced-motion:no-preference){
  .anim .tile{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
  .anim .tile::after{animation:shine 1.3s .55s var(--ease) both;animation-delay:calc(.45s + var(--i,0) * 70ms)}
  .anim .hero .hv,.anim .hero h1{animation:rise .55s var(--ease) both}
  .anim .hero .spark path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.2s .2s var(--ease) forwards}
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shine{from{left:-60%}to{left:130%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* section cards */
.sec{margin:22px 2px 0;font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--zari);box-shadow:0 0 0 3px rgba(231,190,90,.22)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px}
.h{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h>span:last-child:not(:first-child){font-size:12.5px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--t-peacock);border-radius:15px;padding:12px;border:0}
.grid .k:nth-child(4n+2){background:var(--t-leaf)}.grid .k:nth-child(4n+3){background:var(--t-turmeric)}.grid .k:nth-child(4n+4){background:var(--t-kumkum)}
.k .l{font-size:12.5px;color:var(--muted);font-weight:600}.k .v{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.k .n{font-size:12px;color:var(--muted);margin-top:1px}
.red{color:var(--r)}.green{color:var(--g)}.amber{color:var(--a)}
.gate{text-align:center;margin-top:18px;padding:22px 18px}
.gate .lockic{width:58px;height:58px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(150deg,#1B7487,#0C3F4D);color:#FBEFD0;box-shadow:0 12px 22px -14px #0C3F4D}
.gate .lockic svg{width:28px;height:28px}
.gate h2{margin:4px 0 6px;font-size:20px;font-weight:700}.gate p{color:var(--muted);font-size:14px;margin:0 auto 16px;line-height:1.5;max-width:34ch}
#pass{width:100%;max-width:300px;font:inherit;font-size:19px;padding:13px;background:var(--inbg);color:var(--ink);border:2px solid var(--line);border-radius:15px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
#pass:focus{border-color:var(--peacock);box-shadow:0 0 0 4px rgba(15,76,92,.15)}
.btn{border:0;border-radius:15px;padding:13px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(150deg,#1B7487,#0C3F4D);color:#FFF6DD;margin-top:12px;width:100%;max-width:300px;box-shadow:0 10px 20px -14px #0C3F4D;transition:transform .15s}
.btn:active{transform:scale(.98)}
.err{color:var(--r);font-weight:600;font-size:13.5px;min-height:18px;margin-top:10px}
.bad{background:var(--t-kumkum);border:1px solid rgba(179,32,63,.25);color:var(--r);border-radius:16px;padding:18px;margin-top:16px;font-weight:600;text-align:center}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:14px;padding:10px 13px;font-size:13px;font-weight:600;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}.m{color:var(--muted);font-size:12.5px}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tap{cursor:pointer}.row.tap:active,.tap:active{background:var(--soft)}
.tag{display:inline-block;min-width:22px;text-align:center;border-radius:7px;font-size:11.5px;font-weight:700;padding:1px 7px;margin-right:6px}
.tL{background:var(--t-indigo);color:var(--indigo)}.tP{background:var(--t-leaf);color:var(--g)}.tR{background:var(--t-turmeric);color:var(--a)}
html[data-theme=dark] .tL{color:#AFB9F5}
.acts{display:flex;gap:7px;flex:0 0 auto}
.acts a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;text-decoration:none;font-size:17px;background:var(--t-leaf);border:0}
.acts a:first-child{background:var(--t-peacock)}
.seg{display:flex;gap:7px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--peacock);color:#FFF6DD;border-color:var(--peacock)}
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;background:var(--inbg);color:var(--ink);border:2px solid var(--line);border-radius:15px;outline:none}
#q:focus{border-color:var(--peacock);box-shadow:0 0 0 4px rgba(15,76,92,.15)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px}.kv span{color:var(--muted)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.p1{background:var(--t-turmeric);color:var(--a)}.p2{background:var(--t-kumkum);color:var(--r)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
html[data-theme=dark] .card svg text{fill:#93ABAF}

/* bottom navigation */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;width:calc(100% - 20px);max-width:540px;height:var(--nav-h);
  display:flex;align-items:stretch;padding:6px;border-radius:22px;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);box-shadow:0 16px 34px -18px rgba(10,51,64,.55)}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:16px;background:linear-gradient(150deg,#1B7487,#0C3F4D);transition:transform .35s var(--ease),width .35s var(--ease);z-index:0}
.tabs button{position:relative;z-index:1;flex:1 1 0;min-width:0;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);padding:0 2px;transition:color .25s}
.tabs button svg{width:21px;height:21px}
.tabs button span{font-size:10.5px;font-weight:600;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{color:#FFF6DD}

.sheet{position:fixed;inset:0;background:rgba(5,20,24,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.opt input{accent-color:var(--peacock);width:18px;height:18px}
.ph{margin:12px 0 4px;text-align:center}.ph img{max-width:100%;max-height:300px;border-radius:16px;border:1px solid var(--line)}
#report{display:none;background:#fff;color:#111;padding:16px}#report h1{font-size:19px;margin:0 0 4px}#report h2{font-size:14.5px;margin:16px 0 6px}#report table{font-size:12px}#report td,#report th{border-bottom:1px solid #ddd;color:#111}
body.rep .wrap,body.rep .tabs{display:none!important}body.rep #report{display:block}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;line-height:1.5}
.langb{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:360px){.hero .hv{font-size:38px}.tile .tv{font-size:22px}.tabs button span{font-size:9.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.tabs,.tb,.foot,.sheet,#gate,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}html[data-theme=dark] body{background:#fff}}
/* v313 · comparisons, goals, cash, what-if, health, heatmap, call back, opens */
.cmp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cmp span{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:rgba(255,255,255,.2);white-space:nowrap}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{display:flex;align-items:center;gap:10px;min-width:0}
.ring{position:relative;flex:0 0 74px;width:74px;height:74px}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring .pc{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.goal .gl{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.goal .gv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.goal .gs{font-size:11.5px;color:var(--muted)}
.pace{margin-top:10px;font-size:12.5px;font-weight:600;border-radius:12px;padding:8px 11px;background:var(--soft)}
.linkb{border:0;background:none;font:inherit;font-weight:700;color:var(--blue);padding:0;cursor:pointer;font-size:13px}
.cashhero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.cashhero .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cashhero .l{font-size:12.5px;color:var(--muted);font-weight:600}
.io{display:flex;gap:8px;margin-top:10px}
.io>div{flex:1;border-radius:13px;padding:9px 11px;background:var(--t-leaf)}
.io>div:last-child{background:var(--t-kumkum)}
.io .l{font-size:12px;color:var(--muted);font-weight:600}.io .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.slider{width:100%;accent-color:var(--kumkum);margin:10px 0 4px;height:28px}
.wiv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.wiv>div{border-radius:13px;padding:9px 10px;background:var(--t-kumkum)}
.wiv>div:first-child{background:var(--t-turmeric)}.wiv>div:last-child{background:var(--t-lotus)}
.wiv .l{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}.wiv .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.wid{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.wibig{font-size:30px;font-weight:700;color:var(--kumkum);font-variant-numeric:tabular-nums}
html[data-theme=dark] .wibig{color:#FF8FA6}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.hb:last-child{border-bottom:0}
.hb .t{font-size:13.5px;font-weight:600}.hb .a{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hb .bar2{grid-column:1/-1;height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.hb .bar2 i{display:block;height:100%;border-radius:9px;transition:width .9s var(--ease)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.hm .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.hm button{aspect-ratio:1;border:0;border-radius:9px;font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;background:var(--soft);padding:0;position:relative}
.hm button.l1{background:#CDE6E8}.hm button.l2{background:#8CC6CC}.hm button.l3{background:#3E98A4;color:#fff}.hm button.l4{background:#0F4C5C;color:#FFF6DD}
html[data-theme=dark] .hm button.l1{background:#163D45}html[data-theme=dark] .hm button.l2{background:#1F5F69}
.hm button.sel{outline:2.5px solid var(--zari);outline-offset:1px}
.hm button.fut{opacity:.35;cursor:default}
.hm .em{visibility:hidden}
.hmk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.hmk i{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--soft)}
.hmnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.hmnav b{font-size:15px}
.hmnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:36px;height:34px;font:inherit;font-size:16px;cursor:pointer}
.hmnav button:disabled{opacity:.35}
.hmday{margin-top:10px;border-radius:13px;background:var(--soft);padding:10px 12px;font-size:13px}
.wkimg{width:100%;border-radius:14px;border:1px solid var(--line);display:block;margin-top:8px}
.seenr{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.seenr:last-child{border-bottom:0}
.seenr .ok{color:var(--g);font-weight:700}.seenr .no{color:var(--a);font-weight:700}
.ginp{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0}
.ginp label{font-size:13px;font-weight:600;color:var(--muted)}
.ginp input{font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inbg);color:var(--ink);width:100%}
</style>

// ── jewellery photo (own encrypted record, fetched only when the bill is open)
const PHC = {};
async function loadPhoto(bill) {
  const box = document.getElementById('ph'); if (!box || !SEC || DATA.lvl === 'figures') return;
  try {
    const hk = await crypto.subtle.importKey('raw', b64uDec(SEC.k), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const id = b64uEnc(new Uint8Array(await crypto.subtle.sign('HMAC', hk, new TextEncoder().encode('ph:' + bill)))).slice(0, 22);
    let src = PHC[id];
    if (!src) {
      const r = await fetch(SEC.u.replace(/\/+$/, '') + '/p/' + encodeURIComponent(id), { cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) { if (r.status === 404 && document.getElementById('ph') === box) box.innerHTML = '<div class="m">' + T('photoNone') + '</div>'; return; }
      const raw = b64uDec((await r.text()).trim());
      const k = await crypto.subtle.importKey('raw', b64uDec(SEC.k), 'AES-GCM', false, ['decrypt']);
      src = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12)));
      if (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(src)) return;
      PHC[id] = src;
    }
    if (document.getElementById('ph') === box) box.innerHTML = '<img src="' + src + '" alt="">';
  } catch (e) {}
}

  let h = '<div class="noprint" style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" style="margin:0" onclick="window.print()">🖨 ' + T('printRep') + '</button><button class="btn" style="margin:0;background:#666" onclick="closeReport()">' + T('closeRep') + '</button></div>'
    + '<h1>' + esc(D.sn || '') + '</h1><div>' + T('repFor', { m: monthName(mk) }) + '</div>'
    + '<h2>' + T('repTotals') + '</h2><table><tbody>' + row(T('incomeM'), inr(m[1])) + row(T('expM'), inr(exp)) + row(T('profitM'), inr(m[1] - exp))
    + row(T('loansM'), inr(m[2]) + ' (' + m[3] + ')') + row(T('redeemM'), inr(m[4]) + ' (' + m[5] + ')') + '</tbody></table>'
    + '<h2>' + T('repDaily') + '</h2><table><thead><tr><th>' + T('date') + '</th><th class="r">' + T('incomeM') + '</th><th class="r">' + T('loansM') + '</th><th class="r">' + T('redeemM') + '</th><th class="r">' + T('expM') + '</th></tr></thead><tbody>'
    + (days.length ? days.map(r => '<tr><td>' + dmy(r[0]) + '</td><td class="r">' + inr(r[1]) + '</td><td class="r">' + inr(r[2]) + ' (' + r[3] + ')</td><td class="r">' + inr(r[4]) + ' (' + r[5] + ')</td><td class="r">' + inr(r[6]) + '</td></tr>').join('') : '<tr><td colspan="5">' + T('none') + '</td></tr>')
    + '</tbody></table>'
    + '<h2>' + T('repBook', { d: dmy(D.d) }) + '</h2><table><tbody>' + row(T('active'), (F.n || 0)) + row(T('outstanding'), inr(F.prin)) + row(T('od90'), (F.od || 0) + ' · ' + inr(F.odPrin)) + row(T('gGold', { n: (F.gold || 0).toLocaleString('en-IN') }), '') + '</tbody></table>'
    + '<p style="font-size:11px;color:#666;margin-top:14px">' + T('repNote') + '</p>';
  const R = document.getElementById('report'); R.innerHTML = h;
  document.body.classList.add('rep'); window.scrollTo(0, 0); nav();
}
function closeReport(fromBack) { document.body.classList.remove('rep'); document.getElementById('report').innerHTML = ''; if (!fromBack) try { history.back(); } catch (e) {} }

// ── fingerprint / face unlock (WebAuthn passkey + PRF; nothing leaves the phone)
function bioKeyName() { return 'ov_bio_' + (L ? L.tag : ''); }
function bioRec() { try { return JSON.parse(localStorage.getItem(bioKeyName()) || 'null'); } catch (e) { return null; } }
function bioOff() { try { localStorage.removeItem(bioKeyName()); } catch (e) {} }
async function bioKey(out) {
  const base = await crypto.subtle.importKey('raw', out, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('ov-bio-1'), info: new Uint8Array(0) }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function bioGet(rawId, salt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: rawId }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
  const r = a && a.getClientExtensionResults ? a.getClientExtensionResults() : {};
  return (r.prf && r.prf.results && r.prf.results.first) || null;
}
async function bioEnable() {
  if (!SEC) return;
  if (!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext)) { alert(T('bioNo')); return; }
  try {
    const salt = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: (DATA && DATA.sn) || 'Shop owner view' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: ((L.hdr.sn || 'Shop') + (L.hdr.lb ? ' · ' + L.hdr.lb : '')) },
      challenge: crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
    const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if (!ext.prf || ext.prf.enabled === false) { alert(T('bioNo')); return; }
    let out = ext.prf.results && ext.prf.results.first;
    if (!out) out = await bioGet(cred.rawId, salt);
    if (!out) { alert(T('bioNo')); return; }
    const key = await bioKey(out), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(SEC))));
    localStorage.setItem(bioKeyName(), JSON.stringify({ id: b64uEnc(new Uint8Array(cred.rawId)), s: b64uEnc(salt), iv: b64uEnc(iv), ct: b64uEnc(ct) }));
    alert(T('bioOn'));
  } catch (e) { if (!e || e.name !== 'NotAllowedError') alert(T('bioNo')); }
}
async function bioUnlock() {
  const s = bioRec(); if (!s) return;
  const err = document.getElementById('err');
  try {
    const out = await bioGet(b64uDec(s.id), b64uDec(s.s)); if (!out) throw 0;
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(s.iv) }, await bioKey(out), b64uDec(s.ct));
    SEC = JSON.parse(new TextDecoder().decode(pt)); err.textContent = '';
    await remember(); opened();
  } catch (e) { err.textContent = T('bioFail'); }
}
